<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Sysview</title><desc id="d">A system information dashboard with responsive metric cards.</desc><defs><linearGradient id="bg"><stop stop-color="#19263d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#132940" stroke="#536b8c" stroke-width="2"><rect x="90" y="90" width="225" height="130" rx="12"/><rect x="345" y="90" width="225" height="130" rx="12"/><rect x="600" y="90" width="225" height="130" rx="12"/><rect x="855" y="90" width="225" height="130" rx="12"/></g><g fill="#91a0ba" font-family="monospace" font-size="13"><text x="120" y="125">DISPLAY</text><text x="375" y="125">NETWORK</text><text x="630" y="125">HARDWARE</text><text x="885" y="125">TIMEZONE</text></g><g fill="#62e3c1" font-family="monospace" font-size="24"><text x="120" y="175">1920×1080</text><text x="375" y="175">ONLINE</text><text x="630" y="175">8 CORES</text><text x="885" y="175">UTC+00</text></g><path d="M90 245H1080" stroke="#62e3c1" stroke-width="3" stroke-dasharray="0 990"><animate attributeName="stroke-dasharray" values="0 990;990 0" dur="4s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">SYSVIEW</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">DEVICE / BROWSER / NETWORK</text></svg>