<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="SysView banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#16102e"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#4cc9f0" opacity=".35">
    <animate attributeName="y" values="0;218;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- pulsing rings -->
  <g fill="none" stroke="#4cc9f0" stroke-width="1.5">
    <circle cx="780" cy="110" r="20" opacity="0">
      <animate attributeName="r" values="20;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="110" r="20" opacity="0">
      <animate attributeName="r" values="20;80" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- monitor icon -->
  <g transform="translate(748 82)">
    <rect x="0" y="0" width="64" height="44" rx="6" fill="#131a26" stroke="#7c5cff" stroke-width="2.5"/>
    <rect x="22" y="48" width="20" height="6" fill="#7c5cff"/>
    <rect x="14" y="54" width="36" height="3" rx="1.5" fill="#7c5cff"/>
    <polyline points="8,30 20,20 30,26 42,12 56,22" fill="none" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;.4;.8;1" dur="4s" repeatCount="indefinite"/>
    </polyline>
  </g>
  <!-- title -->
  <text x="60" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="62" font-weight="800" fill="url(#tx)">SysView</text>
  <text x="62" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#8696ad">See what your browser reveals.</text>
  <!-- blinking cursor -->
  <rect x="446" y="132" width="3" height="20" fill="#4cc9f0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- floating dots -->
  <g fill="#7c5cff" opacity=".6">
    <circle cx="520" cy="60" r="3"><animate attributeName="cy" values="60;48;60" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="170" r="2.5"><animate attributeName="cy" values="170;180;170" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="64" r="2"><animate attributeName="cy" values="64;54;64" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
